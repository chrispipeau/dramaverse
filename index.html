<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DRAMAVERSE · Banque de hits</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍋</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#14101a;--surface:#1e1827;--surface2:#271f33;--line:#352b44;
  --fg:#f1ecf7;--muted:#a095b0;--accent:#ff7a3d;--accent-fg:#1a0e06;
  --ok:#5fd68a;--warn:#f2b64d;--bad:#ff6b7d;--gold:#f5c542;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);
  padding:0 max(16px,env(safe-area-inset-left)) 60px max(16px,env(safe-area-inset-right))}
.wrap{max-width:1180px;margin:0 auto}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:16px 0 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font:800 24px var(--f-display);letter-spacing:-.02em;margin:0}
h1 span{color:var(--gold)}
.maj{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
input[type=search]{flex:1 1 220px;min-width:0;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
select{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--fg);border:1px solid var(--line);font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tile b{display:block;font:800 24px var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.frow > em{font-style:normal;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;width:62px}
.chip{background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.like{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.card.done{opacity:.55}
.card.nope{opacity:.4}
.hhead{display:flex;gap:10px;align-items:flex-start}
.ht{flex:1;font:700 17px/1.25 var(--f-display);min-width:0}
.hv{font:800 22px var(--f-display);color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.fruit{color:var(--ok);border-color:var(--ok)}
.card p{margin:0}
.meta{font-size:12.5px;color:var(--muted)}
.warn{font-size:12.5px;color:var(--warn)}
.see{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface2);border:1px solid var(--line);color:var(--fg);text-decoration:none;border-radius:10px;padding:8px 12px;font-weight:700}
.see:hover{border-color:var(--accent)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:auto}
.st button{background:var(--surface2);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:7px 2px;font-size:12.5px}
.st button[aria-pressed=true][data-s="J'aime"]{background:var(--ok);color:#0b2414;border-color:var(--ok);font-weight:700}
.st button[aria-pressed=true][data-s="Pas pour moi"]{background:var(--bad);color:#2a070c;border-color:var(--bad);font-weight:700}
.st button[aria-pressed=true][data-s="Faite"]{background:var(--muted);color:var(--bg);border-color:var(--muted);font-weight:700}
.st button[aria-pressed=true][data-s="À regarder"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;z-index:20}
footer{margin-top:30px;color:var(--muted);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><h1>DRAMAVERSE <span>· Banque de hits</span></h1><span class="maj" id="maj"></span></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Chercher un titre, un compte, un mot…" aria-label="Chercher">
    <select id="sort" aria-label="Trier">
      <option value="vues">Les plus vues d'abord</option>
      <option value="fruits">Les plus faciles en fruits</option>
      <option value="titre">Ordre alphabétique</option>
    </select>
    <button class="btn" id="copyLikes">Copier mes « J'aime » pour Claude</button>
  </div>
</header>

<div class="tiles" id="tiles"></div>

<div class="filters">
  <div class="frow"><em>Statut</em><span id="fStatut" class="frow"></span></div>
  <div class="frow"><em>Niche</em><span id="fNiche" class="frow"></span></div>
  <div class="frow"><em>Humeur</em><span id="fHumeur" class="frow"></span></div>
</div>

<div class="grid" id="list"></div>
<footer>Les vidéos sont ajoutées par Claude à chaque veille. Tes choix (« J'aime », « Faite »…) restent enregistrés dans ce navigateur.</footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const ST=["À regarder","J'aime","Pas pour moi","Faite"];
const KEY='dramaverse-statuts-v1';
let HITS=[],F={statut:'Tous',niche:'Toutes',humeur:'Toutes'};
let MINE={};try{MINE=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtV=v=>v>=1?(Math.round(v*10)/10).toString().replace('.',',')+' M':Math.round((v||0)*1000)+' K';
const fmtN=n=>n==null?'—':n>=1e6?(Math.round(n/1e5)/10).toString().replace('.',',')+' M':n>=1e3?(Math.round(n/100)/10).toString().replace('.',',')+' K':String(n);
const fmtD=s=>s>=60?Math.floor(s/60)+' min '+String(s%60).padStart(2,'0'):s+' s';
const statut=h=>MINE[h.id]||h.statut||'À regarder';
function saveMine(){try{localStorage.setItem(KEY,JSON.stringify(MINE))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2000)}
function chips(id,key,vals){$('#'+id).innerHTML=vals.map(v=>`<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${F[key]===v}">${esc(v)}</button>`).join('')}

function render(){
  const H=HITS;
  const n=s=>H.filter(h=>statut(h)===s).length;
  $('#tiles').innerHTML=`
    <div class="tile"><b>${H.length}</b><span>vidéos en stock</span></div>
    <div class="tile"><b>${n("J'aime")}</b><span>j'aime</span></div>
    <div class="tile"><b>${n('À regarder')}</b><span>à regarder</span></div>
    <div class="tile"><b>${n('Faite')}</b><span>déjà faites</span></div>`;
  chips('fStatut','statut',['Tous',...ST]);
  chips('fNiche','niche',['Toutes','Fruits','Hors niche']);
  chips('fHumeur','humeur',['Toutes',...[...new Set(H.map(h=>h.humeur).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'))]);
  const q=$('#q').value.trim().toLowerCase();
  const so=$('#sort').value;
  let L=H.filter(h=>(F.statut==='Tous'||statut(h)===F.statut)&&(F.niche==='Toutes'||h.niche===F.niche)&&(F.humeur==='Toutes'||h.humeur===F.humeur)
    &&(!q||[h.titre,h.resume,h.compte,h.humeur,h.note].join(' ').toLowerCase().includes(q)));
  L.sort(so==='titre'?(a,b)=>a.titre.localeCompare(b.titre,'fr'):so==='fruits'?(a,b)=>(b.fruits||0)-(a.fruits||0)||(b.vues||0)-(a.vues||0):(a,b)=>(b.vues||0)-(a.vues||0));
  $('#list').innerHTML=L.length?L.map(h=>{const s=statut(h);const cls=s==="J'aime"?'like':s==='Faite'?'done':s==='Pas pour moi'?'nope':'';
    return `<article class="card ${cls}">
      <div class="hhead"><div class="ht">${esc(h.titre)}</div><div class="hv">${fmtV(h.vues)}</div></div>
      <div class="pills">${h.humeur?`<span class="pill">${esc(h.humeur)}</span>`:''}<span class="pill ${h.niche==='Fruits'?'fruit':''}">${esc(h.niche)}</span>${h.fruits?`<span class="pill">En fruits ${'★'.repeat(h.fruits)}${'☆'.repeat(5-h.fruits)}</span>`:''}${h.compte?`<span class="pill">${esc(h.compte)}</span>`:''}</div>
      <p>${esc(h.resume)}</p>
      ${h.likes!=null?`<div class="meta">❤ ${fmtN(h.likes)} · 💬 ${fmtN(h.comms)} · ↗ ${fmtN(h.partages)}${h.duree?' · '+fmtD(h.duree):''}${h.date?' · postée le '+esc(h.date):''}</div>`:''}
      ${h.verif?`<div class="warn">⚠ ${esc(h.verif)}</div>`:''}
      ${h.note?`<div class="warn">${esc(h.note)}</div>`:''}
      ${h.lien?`<a class="see" href="${esc(h.lien)}" target="_blank" rel="noopener">▶ Voir la vidéo</a>`:''}
      <div class="st" data-id="${esc(h.id)}">${ST.map(x=>`<button data-s="${esc(x)}" aria-pressed="${x===s}">${esc(x)}</button>`).join('')}</div>
    </article>`}).join(''):`<div class="empty">Aucune vidéo avec ces filtres.</div>`;
}

document.addEventListener('click',async e=>{
  const c=e.target.closest('.chip');if(c){F[c.dataset.k]=c.dataset.v;render();return}
  const b=e.target.closest('.st button');
  if(b){const id=b.parentElement.dataset.id;MINE[id]=b.dataset.s;saveMine();render();toast(`« ${b.dataset.s} » enregistré`);return}
  if(e.target.id==='copyLikes'){
    const L=HITS.filter(h=>statut(h)==="J'aime").sort((a,b)=>(b.vues||0)-(a.vues||0));
    if(!L.length){toast("Aucun « J'aime » pour l'instant");return}
    const txt="Mes J'aime de la banque de hits :\n"+L.map(h=>`- ${h.titre} (${fmtV(h.vues)}) [${h.id}]`).join('\n');
    try{await navigator.clipboard.writeText(txt);toast('Copié : colle-le à Claude')}catch(_){prompt('Copie ce texte :',txt)}
  }
});
$('#q').addEventListener('input',render);
$('#sort').addEventListener('change',render);

fetch('data/hits.json?'+Date.now()).then(r=>r.json()).then(d=>{HITS=d.hits||[];$('#maj').textContent='Mise à jour le '+(d.maj||'');render()})
  .catch(()=>{$('#list').innerHTML='<div class="empty">Impossible de charger la banque. Recharge la page.</div>'});
</script>
</body>
</html>
