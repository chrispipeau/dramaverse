name: Radar TikTok
on:
  push:
    paths: ["scripts/radar.py", ".github/workflows/radar.yml"]
  workflow_dispatch:
  schedule:
    - cron: "43 4,16 * * *"
permissions:
  contents: write
concurrency: radar
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/radar.py
      - run: |
          git config user.name "dramaverse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add radar data/radar.json
          git diff --cached --quiet || (git commit -m "Radar TikTok" && git pull --rebase -q && git push)
